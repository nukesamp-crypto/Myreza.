<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
<title>رضا — گوشه اختصاصی من</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.0.12/400.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/vazirmatn@5.0.12/700.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/lalezar@5.0.12/400.css">
<style>
  :root {
    --bg: #0b0f19;
    --card: #131c31;
    --card-hover: #192642;
    --border: #223259;
    --text: #f3f6fb;
    --muted: #94a3b8;
    --accent: #3b82f6;
    --accent-glow: rgba(59, 130, 246, 0.3);
    --success: #10b981;
    --danger: #ef4444;
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Vazirmatn', sans-serif; }
  body { background-color: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; line-height: 1.7; }
  
  .container { width: 100%; max-width: 700px; margin: auto; }
  
  /* Header Card */
  .hero {
    background: linear-gradient(135deg, var(--card), #1e293b);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 30px;
    text-align: center;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    margin-bottom: 24px;
    position: relative;
    overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute;
    top: -50px; left: -50px;
    width: 150px; height: 150px;
    background: var(--accent);
    filter: blur(80px);
    opacity: 0.4;
  }
  .avatar {
    width: 90px; height: 90px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--accent), #8b5cf6);
    display: flex; align-items: center; justify-content: center;
    font-family: 'Lalezar', cursive;
    font-size: 2.5rem;
    color: #fff;
    margin: 0 auto 15px;
    box-shadow: 0 0 20px var(--accent-glow);
  }
  .hero h1 { font-family: 'Lalezar', cursive; font-size: 2rem; margin-bottom: 5px; letter-spacing: 1px; }
  .hero p { color: var(--muted); font-size: 0.95rem; }

  /* Widgets Grid */
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-bottom: 24px; }
  @media(max-width: 500px) { .grid { grid-template-columns: 1fr; } }

  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    transition: transform 0.2s ease, border-color 0.2s ease;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-3px); }
  .card h3 { font-size: 1.05rem; margin-bottom: 10px; color: var(--accent); display: flex; align-items: center; gap: 8px; }
  .card p { font-size: 0.9rem; color: var(--muted); }

  /* Admin & Action Section */
  .actions { display: flex; gap: 10px; justify-content: center; margin-bottom: 24px; }
  .btn {
    background: var(--accent);
    color: #fff;
    border: none;
    padding: 12px 24px;
    border-radius: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: opacity 0.2s, transform 0.2s;
    box-shadow: 0 4px 12px var(--accent-glow);
  }
  .btn:hover { opacity: 0.9; transform: scale(1.02); }
  .btn.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); box-shadow: none; }
  .btn.secondary:hover { background: var(--card-hover); }

  /* Admin Panel */
  .admin-panel {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 20px;
    margin-bottom: 24px;
    display: none;
  }
  .admin-panel.active { display: block; }
  .admin-panel h3 { margin-bottom: 15px; color: #f59e0b; }
  .admin-panel textarea {
    width: 100%; height: 100px; background: var(--bg); border: 1px solid var(--border);
    color: var(--text); padding: 12px; border-radius: 10px; resize: vertical; margin-bottom: 10px;
  }

  /* Footer */
  footer { text-align: center; color: var(--muted); font-size: 0.85rem; margin-top: auto; padding: 20px 0; }
  footer span { color: var(--accent); }
</style>
</head>
<body>

<div class="container">
  <!-- Hero Section -->
  <div class="hero">
    <div class="avatar">ر</div>
    <h1>رضا</h1>
    <p>به گوشه اختصاصی و مدرن من خوش آمدید 🚀</p>
  </div>

  <!-- Widgets Grid -->
  <div class="grid">
    <div class="card">
      <h3>⏰ ساعت و زمان</h3>
      <p id="clock">در حال بارگذاری...</p>
    </div>
    <div class="card">
      <h3>⚡ وضعیت سیستم</h3>
      <p>🟢 آنلاین و فعال</p>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn" onclick="toggleAdmin()">🔐 پنل مدیریت</button>
    <button class="btn secondary" onclick="alert('سلام! طراحی جدید توسط هرمس انجام شد.')">👋 درباره من</button>
  </div>

  <!-- Admin Panel -->
  <div class="admin-panel" id="adminPanel">
    <h3>⚙️ پنل مدیریت پیشرفته</h3>
    <p style="font-size: 0.85rem; color: var(--muted); margin-bottom: 10px;">یادداشت یا متن دلخواه خود را برای نمایش در سایت وارد کنید:</p>
    <textarea id="adminNote" placeholder="متن خود را اینجا بنویسید..."></textarea>
    <button class="btn" style="background: var(--success);" onclick="saveNote()">ذخیره تغییرات</button>
  </div>

  <footer>
    طراحی شده با ❤️ توسط <span>هرمس</span> برای رضا
  </footer>
</div>

<script>
  // Clock update
  function updateClock() {
    const now = new Date();
    document.getElementById('clock').innerText = now.toLocaleTimeString('fa-IR');
  }
  setInterval(updateClock, 1000);
  updateClock();

  // Admin Toggle
  function toggleAdmin() {
    const pass = prompt('رمز عبور پنل ادمین را وارد کنید:');
    if (pass === '1234' || pass === 'admin') {
      document.getElementById('adminPanel').classList.toggle('active');
      alert('با موفقیت وارد پنل مدیریت شدید!');
    } else if (pass !== null) {
      alert('رمز عبور اشتباه است!');
    }
  }

  function saveNote() {
    const note = document.getElementById('adminNote').value;
    localStorage.setItem('user_note', note);
    alert('تغییرات با موفقیت ذخیره شد!');
  }
</script>

</body>
</html>
